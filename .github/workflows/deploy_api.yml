# Build the forecast API image with one registered model version baked in,
# push it to ECR and deploy infra/api.yaml (Lambda + Function URL).
#
# AWS access is GitHub OIDC -> the shef2-github-deploy role from
# infra/bootstrap.yaml: no AWS keys in GitHub. (The AWS_* secrets in this repo
# are Cloudflare R2 keys for DVC and are not used here.)
name: deploy-api

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: shef2-day-ahead version number, or "champion" for the @champion alias
        default: "champion"
  push:
    branches: [main]
    paths:
      - src/shef/serving/**
      - src/shef/models/predict.py
      - src/shef/features/bundle.py
      - src/shef/models/targets.py
      - Dockerfile
      - infra/api.yaml
      - .github/workflows/deploy_api.yml

concurrency: deploy-api

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1          # same region as the Supabase database
  MODEL_REF: ${{ inputs.model_version || 'champion' }}   # a version number or the @champion alias

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --frozen

      - name: API tests
        run: uv run pytest -q tests/test_serving.py

      - name: Fetch model (${{ env.MODEL_REF }}) from the registry
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          uv run python scripts/fetch_model.py --version "$MODEL_REF" --out build/model
          echo "MODEL_VERSION=$(python3 -c "import json; print(json.load(open('build/model/model_meta.json'))['model_version'])")" >> "$GITHUB_ENV"
          uv export --only-group serve --no-hashes --frozen --no-emit-project -o build/requirements-serve.txt

      - name: Build image
        run: docker build --platform linux/amd64 --provenance=false -t shef2-api:local .

      - name: Import the handler inside the image
        run: docker run --rm --entrypoint python shef2-api:local -c "from shef.serving.app import handler, app; print('handler OK:', app.title)"

      - name: Container smoke test (Lambda runtime emulator, Function URL event)
        run: |
          docker run -d --name api -p 9000:8080 shef2-api:local
          trap 'echo "--- container log"; docker logs api 2>&1 | tail -40' EXIT
          sleep 3
          EVENT='{"version":"2.0","routeKey":"$default","rawPath":"/health","rawQueryString":"",
                  "headers":{"host":"local"},"requestContext":{"http":{"method":"GET","path":"/health",
                  "protocol":"HTTP/1.1","sourceIp":"127.0.0.1","userAgent":"ci"}},"isBase64Encoded":false}'
          OUT=$(curl -s --retry 5 --retry-connrefused --retry-delay 2 -d "$EVENT"                 http://localhost:9000/2015-03-31/functions/function/invocations)
          echo "response: ${OUT:0:500}"
          echo "$OUT" | python3 -c "
          import json, sys
          r = json.load(sys.stdin); h = json.loads(r['body'])
          assert r['statusCode'] == 200 and h['status'] == 'ok', r
          print('container OK:', h['model_name'], 'v' + h['model_version'], len(h['features']), 'features')"

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Push image
        id: image
        env:
          REPO: ${{ steps.ecr.outputs.registry }}/shef2-api
        run: |
          TAG="${GITHUB_SHA::12}-m${MODEL_VERSION}"
          docker tag shef2-api:local "$REPO:$TAG"
          docker push "$REPO:$TAG"
          echo "uri=$REPO:$TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy stack
        env:
          # api_writer (sql/006): insert forecasts + fill actuals only; never the postgres URL
          API_DATABASE_URL: ${{ secrets.API_DATABASE_URL }}
        run: |
          test -n "$API_DATABASE_URL" || { echo "::error::secret API_DATABASE_URL is not set (scripts/set_role_login.py)"; exit 1; }
          # A first create that failed leaves ROLLBACK_COMPLETE, which can only be deleted.
          STATUS=$(aws cloudformation describe-stacks --stack-name shef2-api \
                   --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" = ROLLBACK_COMPLETE ]; then
            aws cloudformation delete-stack --stack-name shef2-api
            aws cloudformation wait stack-delete-complete --stack-name shef2-api
          fi
          trap 'aws cloudformation describe-stack-events --stack-name shef2-api --max-items 15 \
                  --query "StackEvents[?contains(ResourceStatus, \`FAILED\`)].[LogicalResourceId,ResourceStatusReason]" \
                  --output text || true' ERR
          aws cloudformation deploy --stack-name shef2-api --template-file infra/api.yaml \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "ImageUri=${{ steps.image.outputs.uri }}" \
              "DatabaseUrl=$API_DATABASE_URL"

      - name: Smoke test /health (signed with this job's role)
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name shef2-api                 --query "Stacks[0].Outputs[?OutputKey=='FunctionUrl'].OutputValue" --output text)
          echo "API: $URL" | tee -a "$GITHUB_STEP_SUMMARY"
          code=$(curl -s -o /dev/null -w "%{http_code}" "${URL}health")
          echo "unsigned request -> HTTP $code (expect 403)"; test "$code" = 403
          uv run python -c "
          import os, sys, time
          from shef.serving import client
          t = time.time(); h = client.get(sys.argv[1], '/health')
          assert h['status'] == 'ok' and h['model_version'] == os.environ['MODEL_VERSION'], h
          print(f'signed /health in {time.time() - t:.1f}s: serving', h['model_name'], 'v' + h['model_version'],
                'run', h['mlflow_run_id'], '|', len(h['features']), 'features')
          # A database round trip as api_writer: 2026-10-15 is the first live day, fully logged.
          g = client.get(sys.argv[1], '/logged?target_day=2026-10-15')
          assert g['hours_logged'] == 24 and g['complete'], g
          print('signed /logged as api_writer:', g)" "$URL"
