# Build the forecast API image with one registered model version baked in,
# push it to ECR and deploy infra/api.yaml (Lambda + Function URL).
#
# AWS access is GitHub OIDC -> the shef2-github-deploy role from
# infra/bootstrap.yaml: no AWS keys in GitHub. (The AWS_* secrets in this repo
# are Cloudflare R2 keys for DVC and are not used here.)
name: deploy-api

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: shef2-day-ahead registry version to serve
        default: "1"
  push:
    branches: [main]
    paths:
      - src/shef/serving/**
      - src/shef/models/predict.py
      - src/shef/features/bundle.py
      - src/shef/models/targets.py
      - Dockerfile
      - infra/api.yaml
      - .github/workflows/deploy_api.yml

concurrency: deploy-api

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1          # same region as the Supabase database
  MODEL_VERSION: ${{ inputs.model_version || '1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --frozen

      - name: API tests
        run: uv run pytest -q tests/test_serving.py

      - name: Fetch model v${{ env.MODEL_VERSION }} from the registry
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          uv run python scripts/fetch_model.py --version "$MODEL_VERSION" --out build/model
          uv export --only-group serve --no-hashes --frozen --no-emit-project -o build/requirements-serve.txt

      - name: Build image
        run: docker build --platform linux/amd64 --provenance=false -t shef2-api:local .

      - name: Container smoke test (Lambda runtime emulator, Function URL event)
        run: |
          docker run -d --name api -p 9000:8080 -e API_KEY=local-test-key-0123456789abcdef0123 shef2-api:local
          sleep 3
          EVENT='{"version":"2.0","routeKey":"$default","rawPath":"/health","rawQueryString":"",
                  "headers":{"host":"local"},"requestContext":{"http":{"method":"GET","path":"/health",
                  "protocol":"HTTP/1.1","sourceIp":"127.0.0.1","userAgent":"ci"}},"isBase64Encoded":false}'
          OUT=$(curl -sf -d "$EVENT" http://localhost:9000/2015-03-31/functions/function/invocations)
          docker logs api | tail -20
          echo "$OUT" | python3 -c "
          import json, sys
          r = json.load(sys.stdin); h = json.loads(r['body'])
          assert r['statusCode'] == 200 and h['status'] == 'ok', r
          print('container OK:', h['model_name'], 'v' + h['model_version'], len(h['features']), 'features')"

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Push image
        id: image
        env:
          REPO: ${{ steps.ecr.outputs.registry }}/shef2-api
        run: |
          TAG="${GITHUB_SHA::12}-m${MODEL_VERSION}"
          docker tag shef2-api:local "$REPO:$TAG"
          docker push "$REPO:$TAG"
          echo "uri=$REPO:$TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy stack
        run: |
          aws cloudformation deploy --stack-name shef2-api --template-file infra/api.yaml \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "ImageUri=${{ steps.image.outputs.uri }}" \
              "DatabaseUrl=${{ secrets.SUPABASE_DATABASE_URL }}" \
              "ApiKey=${{ secrets.SHEF_API_KEY }}"

      - name: Smoke test /health
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name shef2-api \
                --query "Stacks[0].Outputs[?OutputKey=='FunctionUrl'].OutputValue" --output text)
          echo "API: $URL" >> "$GITHUB_STEP_SUMMARY"
          START=$(date +%s.%N)
          BODY=$(curl -sf --retry 3 --retry-delay 5 "${URL}health")
          echo "cold /health in $(echo "$(date +%s.%N) - $START" | bc) s: $BODY"
          echo "$BODY" | python3 -c "
          import json, os, sys
          h = json.load(sys.stdin)
          assert h['status'] == 'ok' and h['model_version'] == os.environ['MODEL_VERSION'], h
          print('serving', h['model_name'], 'v' + h['model_version'], 'run', h['mlflow_run_id'], '|', len(h['features']), 'features')"
