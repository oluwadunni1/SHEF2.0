AWSTemplateFormatVersion: "2010-09-09"
Description: >
  SHEF 2.0, one-time bootstrap (run by hand in CloudShell). Creates what the
  deploy workflow cannot create for itself: the GitHub OIDC trust, two roles
  GitHub Actions assumes (deploy: build + deploy the stack; forecast: only
  invoke the API), the ECR repository, and the Lambda execution role.
  No long-lived AWS keys are stored anywhere.

Parameters:
  GitHubSubjectPrefix:
    Type: String
    # GitHub's immutable OIDC subject: owner and repo names pinned to their numeric
    # ids, so a deleted-and-recreated repo with the same name cannot assume these
    # roles. Check with: gh api repos/<owner>/<repo>/actions/oidc/customization/sub
    Default: repo:oluwadunni1@171298512/SHEF2.0@1415648897
  CreateOIDCProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: false if this account already has token.actions.githubusercontent.com

Conditions:
  MakeOIDC: !Equals [!Ref CreateOIDCProvider, "true"]

Resources:
  GitHubOIDC:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOIDC
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: shef2-api
      ImageScanningConfiguration: {ScanOnPush: true}
      # Lambda pulls the image itself, so the repository must allow the Lambda
      # service, and only on behalf of the shef2-api function.
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaPull
            Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
            Condition:
              StringLike:
                aws:sourceArn: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:shef2-api*
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules": [{"rulePriority": 1, "description": "keep the last 5 images",
            "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 5},
            "action": {"type": "expire"}}]}

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: shef2-api-exec
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: shef2-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub ${GitHubSubjectPrefix}:ref:refs/heads/main
      Policies:
        - PolicyName: deploy-shef2-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPush
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt Repository.Arn
              - Sid: Stack
                Effect: Allow
                Action: cloudformation:*
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/shef2-api/*
              - Sid: StackRead
                Effect: Allow
                Action: [cloudformation:DescribeStacks, cloudformation:ValidateTemplate]
                Resource: "*"
              - Sid: Function
                Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:shef2-api*
              - Sid: Logs
                Effect: Allow
                Action: logs:*
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/shef2-api*
              - Sid: LogsDescribe
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Sid: PassExecRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ExecutionRole.Arn

  ForecastRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: shef2-github-forecast
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub ${GitHubSubjectPrefix}:ref:refs/heads/main
      Policies:
        - PolicyName: invoke-shef2-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [lambda:InvokeFunctionUrl, lambda:InvokeFunction]
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:shef2-api

Outputs:
  DeployRoleArn:
    Description: GitHub secret AWS_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  ForecastRoleArn:
    Description: GitHub secret AWS_FORECAST_ROLE_ARN
    Value: !GetAtt ForecastRole.Arn
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  ExecutionRoleArn:
    Value: !GetAtt ExecutionRole.Arn
    Export: {Name: shef2-api-exec-role}
