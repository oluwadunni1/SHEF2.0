AWSTemplateFormatVersion: "2010-09-09"
Description: >
  SHEF 2.0 forecast API: one Lambda (container image) behind a Function URL (AWS_IAM auth).
  Deployed by .github/workflows/deploy_api.yml; the image tag is the git commit.

Parameters:
  ImageUri:
    Type: String
  DatabaseUrl:
    Type: String
    NoEcho: true

Resources:
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/shef2-api
      RetentionInDays: 14

  Function:
    Type: AWS::Lambda::Function
    DependsOn: Logs
    Properties:
      FunctionName: shef2-api
      Description: Day-ahead hourly load forecast, ERCOT South Central
      PackageType: Image
      Code: {ImageUri: !Ref ImageUri}
      Role: !ImportValue shef2-api-exec-role
      Architectures: [x86_64]
      MemorySize: 1024
      Timeout: 60   # cold start (image pull + pandas/lightgbm import) measured 18.6 s
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl

  Url:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref Function
      # Lambda rejects any request not SigV4-signed by a principal whose IAM policy
      # allows lambda:InvokeFunctionUrl on this function (same account: no
      # resource policy needed). The app itself holds no credentials to check.
      AuthType: AWS_IAM

Outputs:
  FunctionUrl:
    Value: !GetAtt Url.FunctionUrl
